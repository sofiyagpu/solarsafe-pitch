<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const box = document.getElementById('solarsafe-3d');
const canvas = box.querySelector('canvas');
const data = JSON.parse(document.getElementById('solarsafe-data').textContent);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
camera.up.set(0, 0, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a8, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(-250, -300, 500); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(300, 250, 150); scene.add(rim);

const decode = (s, T) => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const group = new THREE.Group();
for (const [name, p] of Object.entries(data)) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(decode(p.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(decode(p.f, Uint32Array), 1));
  const flat = g.toNonIndexed(); flat.computeVertexNormals();
  const isPanel = name === 'panel';
  const mesh = new THREE.Mesh(flat, new THREE.MeshStandardMaterial({
    color: p.color, roughness: isPanel ? 0.3 : 0.6, metalness: isPanel ? 0.15 : 0
  }));
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30),
    new THREE.LineBasicMaterial({ color: 0x3a3f45, transparent: true, opacity: 0.25 })));
  group.add(mesh);
}
scene.add(group);

// centre the model and frame it
const bb = new THREE.Box3().setFromObject(group);
const centre = bb.getCenter(new THREE.Vector3());
group.position.sub(centre);
const radius = bb.getSize(new THREE.Vector3()).length() / 2;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = radius * 1.2;
controls.maxDistance = radius * 6;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate = !reduce;
controls.autoRotateSpeed = 4;
controls.addEventListener('start', () => { controls.autoRotate = false; });

function frame() {
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.3 : 0.95);
  camera.position.set(-0.55 * dist, -0.7 * dist, 0.45 * dist);
  controls.target.set(0, 0, 0);
  controls.update();
}
function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(box);
resize(); frame();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
